spring.application.name=coreoflow-test

# H2 em memória — os testes não tocam na base MySQL de desenvolvimento/produção
spring.datasource.url=jdbc:h2:mem:coreoflow_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Sem migrações Flyway nos testes: o schema é gerado pelo Hibernate a partir das entidades
spring.flyway.enabled=false

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@coreoflow.test
spring.mail.password=test
app.suporte.email=suporte@coreoflow.test

google.drive.client-id=
google.drive.client-secret=
google.drive.refresh-token=

r2.account-id=
r2.access-key-id=
r2.secret-access-key=
r2.bucket=coreoflow-videos-test

vaadin.launch-browser=false
