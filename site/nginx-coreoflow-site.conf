# Site institucional / comercial do CoreoFlow — coreoflow.me
# Fica em /etc/nginx/sites-available/coreoflow-site (symlink em sites-enabled).
# O certbot acrescenta o bloco 443 + redirect quando o DNS apontar para o servidor.

server {
    listen 80;
    listen [::]:80;
    server_name coreoflow.me www.coreoflow.me;

    root /var/www/coreoflow;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:png|ico|svg|jpe?g|webp|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/coreoflow-site.access.log;
    error_log  /var/log/nginx/coreoflow-site.error.log;
}
